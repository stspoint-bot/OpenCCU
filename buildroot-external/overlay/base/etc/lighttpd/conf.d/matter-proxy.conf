# CCU3-neu: Matter-Oberflaeche fest im Systemabbild (wird von S50lighttpd ueber /var/etc/lighttpd_matter.conf eingebunden).
# https://<CCU>/ (Port 443) -> Reverse-Proxy auf die Bridge (127.0.0.1:8090); Port 80 -> 302 auf https. Ausgenommen: Anfragen von der CCU selbst,
# /api/<datei> (CCU-JSON-RPC), /upnp/, /addons, /tailscale/, /tools/ sowie die Funk-Schnittstellen. Fehlerseiten (500/502/503/504): /www/error/ (Startet-neu-Seite).
$SERVER["socket"] == ":443" {
  $HTTP["remoteip"] !~ "^(127\.|::1$|::ffff:127\.)" {
    $HTTP["url"] !~ "^/(api/.+|upnp/|addons|tailscale/|tools/)" {
      server.stream-response-body = 2
      # Bridge setzt X-Frame-Options/X-Content-Type-Options/Referrer-Policy selbst; lighttpds Standardliste hier ohne diese drei (keine Doppelung)
      setenv.add-response-header = ( "X-XSS-Protection" => "1; mode=block", "X-Robots-Tag" => "none", "X-Download-Options" => "noopen", "X-Permitted-Cross-Domain-Policies" => "none" )
      server.stream-request-body = 2
      proxy.server = ( "" => (( "host" => "127.0.0.1", "port" => 8090 )) )
      proxy.header = ( "upgrade" => "enable" )
    }
  }
}
$SERVER["socket"] == "[::]:443" {
  $HTTP["remoteip"] !~ "^(127\.|::1$|::ffff:127\.)" {
    $HTTP["url"] !~ "^/(api/.+|upnp/|addons|tailscale/|tools/)" {
      server.stream-response-body = 2
      # Bridge setzt X-Frame-Options/X-Content-Type-Options/Referrer-Policy selbst; lighttpds Standardliste hier ohne diese drei (keine Doppelung)
      setenv.add-response-header = ( "X-XSS-Protection" => "1; mode=block", "X-Robots-Tag" => "none", "X-Download-Options" => "noopen", "X-Permitted-Cross-Domain-Policies" => "none" )
      server.stream-request-body = 2
      proxy.server = ( "" => (( "host" => "127.0.0.1", "port" => 8090 )) )
      proxy.header = ( "upgrade" => "enable" )
    }
  }
}
$SERVER["socket"] == ":80" {
  $HTTP["remoteip"] !~ "^(127\.|::1$|::ffff:127\.)" {
    $HTTP["url"] !~ "^/(api/.+|upnp/|addons|tailscale/|tools/)" {
      $HTTP["host"] =~ "^([^:\[\]]+)" {
        url.redirect = ( "" => "https://%1/" )
        url.redirect-code = 302
      }
    }
  }
}
$SERVER["socket"] == "[::]:80" {
  $HTTP["remoteip"] !~ "^(127\.|::1$|::ffff:127\.)" {
    $HTTP["url"] !~ "^/(api/.+|upnp/|addons|tailscale/|tools/)" {
      $HTTP["host"] =~ "^([^:\[\]]+)" {
        url.redirect = ( "" => "https://%1/" )
        url.redirect-code = 302
      }
    }
  }
}

# Kein Zugriffsprotokoll fuer Anfragen von der CCU selbst (Bridge -> lighttpd :80/:2001/:2010 ...): weniger Log-Wachstum im RAM (/var ist tmpfs).
$HTTP["remoteip"] =~ "^(127\.0\.0\.1|::ffff:127\.0\.0\.1|::1)$" {
  accesslog.filename = ""
}
