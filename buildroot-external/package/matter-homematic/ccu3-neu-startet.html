<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="15">
<meta name="robots" content="noindex">
<title>CCU3 Matter startet neu</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f6f8; --fg:#1b2733; --card:#fff; --mut:#5b6b7a; --acc:#0a6cff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#10161c; --fg:#e6edf3; --card:#1a232c; --mut:#9fb0bf; --acc:#4c9aff; } }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { min-height:100%; display:flex; align-items:center; justify-content:center; padding:16px; box-sizing:border-box; }
  .card { background:var(--card); border-radius:14px; padding:28px 24px; max-width:420px; width:100%; box-shadow:0 2px 14px rgba(0,0,0,.12); text-align:center; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { margin:6px 0; color:var(--mut); }
  .spin { width:34px; height:34px; margin:0 auto 14px; border:4px solid var(--mut); border-top-color:var(--acc); border-radius:50%; animation:s 1s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
  button { margin-top:14px; padding:10px 18px; font:inherit; border:0; border-radius:8px; background:var(--acc); color:#fff; cursor:pointer; }
</style>
</head>
<body>
<main><div class="card">
  <div class="spin" aria-hidden="true"></div>
  <h1>CCU3 Matter startet gerade neu</h1>
  <p>Bitte in 1&ndash;3 Minuten neu laden. Diese Seite lädt sich alle 15&nbsp;Sekunden selbst neu und geht weiter, sobald die CCU bereit ist.</p>
  <p id="st">Prüfe &hellip;</p>
  <button onclick="location.reload()">Jetzt neu laden</button>
</div></main>
<script>
(function () {
  var n = 0, st = document.getElementById('st');
  function check() {
    n++;
    fetch('/api/?method=webAuthInfo', { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : Promise.reject(); })
      .then(function (t) { if (t.indexOf('mh-web-auth-v1') > -1) { st.textContent = 'Bereit – Seite wird geladen …'; location.replace('/'); } else { throw 0; } })
      .catch(function () { st.textContent = 'Noch nicht bereit (Versuch ' + n + ')'; });
  }
  setTimeout(check, 4000); setInterval(check, 5000);
})();
</script>
</body>
</html>
