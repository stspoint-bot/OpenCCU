name: CCU3-neu Build (rpi3)
# Vollautomatisch: baut bis zu 5h40 pro Lauf, speichert Quellen + ccache, startet sich bei unfertigem Bau selbst neu
# (max. 8 Laeufe hintereinander) und legt das fertige Image als Release "build-<datum>-<lauf>" ab.
on:
  workflow_dispatch:
    inputs:
      attempt:
        description: 'Laufende Nummer der Fortsetzung (nicht von Hand setzen)'
        default: '1'
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Platz schaffen und Abhaengigkeiten
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wget bc cpio rsync zip python3 file unzip patch perl libncurses-dev libssl-dev ccache
          sudo mkdir -p /mnt/work && sudo chown runner:runner /mnt/work
          df -h / /mnt

      - name: Cache Quellen (download)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /mnt/work/download
          key: dl-rpi3-${{ github.run_id }}
          restore-keys: dl-rpi3-

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /mnt/work/ccache
          key: cc-rpi3-${{ github.run_id }}
          restore-keys: cc-rpi3-

      - name: Build (max. 5h40)
        id: build
        run: |
          mkdir -p /mnt/work/download /mnt/work/ccache
          DATE=$(date +%Y%m%d)
          set +e
          timeout 20400 nice -n 19 make DATE=$DATE BR2_DL_DIR=/mnt/work/download BR2_CCACHE_DIR=/mnt/work/ccache BR2_JLEVEL=$(nproc) PRODUCT=rpi3 release > /mnt/work/build.log 2>&1
          RC=$?
          echo "make exit: $RC"
          tail -n 40 /mnt/work/build.log
          ls -la release/ || true
          if ls release/OpenCCU-*-rpi3.zip >/dev/null 2>&1; then echo "done=true" >> "$GITHUB_OUTPUT"; else echo "done=false" >> "$GITHUB_OUTPUT"; fi
          echo "rc=$RC" >> "$GITHUB_OUTPUT"

      - name: Fertiges Image als Release ablegen
        if: steps.build.outputs.done == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-$(date +%Y%m%d)-${{ github.run_id }}"
          gh release create "$TAG" release/OpenCCU-*-rpi3.zip* /mnt/work/build.log --title "CCU3-neu $TAG" --notes "Automatischer Bau (rpi3). Nur mit Freigabe von Thomas aufspielen."

      - name: Build-Log sichern (bei Fehlschlag)
        if: steps.build.outputs.done != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: build-log-${{ github.run_id }}
          path: /mnt/work/build.log
          retention-days: 7

    outputs:
      done: ${{ steps.build.outputs.done }}
      rc: ${{ steps.build.outputs.rc }}

  weiter:
    # Eigener Job: laeuft erst, wenn der Bau-Job samt Cache-Speicherung beendet ist.
    needs: build
    permissions:
      actions: write
      contents: read
    if: needs.build.outputs.done != 'true' && needs.build.outputs.rc == '124' && fromJSON(github.event.inputs.attempt) < 8
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fortsetzung starten
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ github.event.inputs.attempt }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          case "$ATTEMPT" in ''|*[!0-9]*) echo "attempt ungueltig"; exit 1;; esac
          NEXT=$(( ATTEMPT + 1 ))
          gh workflow run ccu3-neu-build.yml --ref "$REF_NAME" -f attempt=$NEXT -R "$REPO"
